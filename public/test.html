<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lead Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body{
            background:#072c67;
            min-height:100vh;
            padding:30px;
            color:white;
            font-family:'Segoe UI',sans-serif;
        }

        .form-wrapper{
            max-width:1100px;
            margin:auto;
        }

        .section-title{
            color:#11d4c7;
            font-size:28px;
            font-weight:700;
            margin-bottom:15px;
        }

        .section-box{
            border:2px dashed rgba(17,212,199,.7);
            border-radius:30px;
            padding:28px 32px;
            margin-bottom:35px;
        }

        .field-label{
            font-size:20px;
            font-weight:500;
            white-space:nowrap;
        }

        .custom-input{
            height:56px;
            border-radius:14px;
            border:none;
            font-size:20px;
            color:#5c6770;
        }

        .custom-input::placeholder{
            color:#b0b0b0;
        }

        .upload-btn{
            height:58px;
            width:260px;
            border:none;
            border-radius:14px;
            background:white;
            color:#b2b2b2;
            font-size:24px;
            font-weight:500;
        }

        .upload-preview{
            border:2px solid rgba(255,255,255,.35);
            border-radius:12px;
            min-width:280px;
            min-height:80px;
            padding:10px;
        }

        .preview-images{
            display:flex;
            gap:12px;
            justify-content:center;
        }

        .preview-images img{
            width:42px;
            height:42px;
            object-fit:cover;
            border-radius:6px;
        }

        .upload-status{
            text-align:center;
            font-size:13px;
            margin-top:5px;
            color:white;
        }

        /* Toggle */

        .switch{
            position:relative;
            display:inline-block;
            width:105px;
            height:55px;
        }

        .switch input{
            display:none;
        }

        .slider{
            position:absolute;
            inset:0;
            background:#d7d7d7;
            border-radius:50px;
            transition:.3s;
        }

        .slider:before{
            content:"";
            position:absolute;
            width:45px;
            height:45px;
            left:5px;
            top:5px;
            background:white;
            border-radius:50%;
            transition:.3s;
            box-shadow:0 2px 8px rgba(0,0,0,.3);
        }

        input:checked + .slider{
            background:#11d4c7;
        }

        input:checked + .slider:before{
            transform:translateX(50px);
        }

        .summary-chip{
            background:#d9ebff;
            color:#65717b;
            border-radius:6px;
            padding:8px 18px;
            font-size:18px;
            line-height:1;
            display:inline-flex;
            align-items:center;
            height:42px;
        }

        .manager-label{
            font-size:24px;
            font-weight:500;
        }

        .manager-input{
            height:64px;
            border:none;
            border-radius:14px;
            font-size:26px;
            color:#8d8d8d;
        }

        .action-btn{
            width:430px;
            height:90px;
            border:none;
            border-radius:50px;
            font-size:38px;
            font-weight:700;
            color:white;

            background:linear-gradient(
                180deg,
                #14d8cc 0%,
                #08c6ba 100%
            );
        }

        .action-btn:hover{
            opacity:.95;
        }

    </style>
</head>

<body>

<div class="form-wrapper">

    <!-- SECTION 3 -->

    <div class="section-title">
        SECTION 3: Estimates & Photos
    </div>

    <div class="section-box">

        <div class="row align-items-center mb-4">

            <div class="col-md-4 field-label">
                No. of Technicians
            </div>

            <div class="col-md-2">
                <input type="number"
                       id="techCount"
                       class="form-control custom-input"
                       placeholder="Enter">
            </div>

            <div class="col-md-2 field-label">
                Hrs. Req.
            </div>

            <div class="col-md-2">
                <input type="number"
                       id="hrsReq"
                       class="form-control custom-input"
                       placeholder="Enter">
            </div>

        </div>

        <div class="row align-items-center mb-4">

            <div class="col-md-4 field-label">
                Apprentice Req.
            </div>

            <div class="col-md-2">
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="col-md-2 field-label">
                After Hrs.
            </div>

            <div class="col-md-2">
                <label class="switch">
                    <input type="checkbox" id="afterHours">
                    <span class="slider"></span>
                </label>
            </div>

        </div>

        <div class="row align-items-center">

            <div class="col-md-4 field-label">
                Upload Photos
            </div>

            <div class="col-md-3">

                <input
                    type="file"
                    id="photoUpload"
                    multiple
                    accept="image/*"
                    hidden>

                <button
                    type="button"
                    class="upload-btn"
                    id="uploadBtn">

                    Upload Photo ↑

                </button>

            </div>

            <div class="col-md-4">

                <div class="upload-preview" id="previewContainer">

                    <div class="upload-status">
                        No images uploaded
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- SECTION 4 -->

    <div class="section-title">
        SECTION 4: Verify & Submit
    </div>

    <div class="section-box">

        <div class="d-flex flex-wrap gap-3 mb-4">

            <div class="summary-chip">
                Bruce Williams
            </div>

            <div class="summary-chip">
                3 Faults
            </div>

            <div class="summary-chip" id="techSummary">
                1 Tech.
            </div>

            <div class="summary-chip" id="hrsSummary">
                4 Hrs
            </div>

            <div class="summary-chip" id="afterSummary">
                After Hrs.
            </div>

        </div>

        <div class="row align-items-center">

            <div class="col-md-4 manager-label">
                Your Manager Name
            </div>

            <div class="col-md-8">
                <input
                    type="text"
                    class="form-control manager-input"
                    placeholder="Auto / Select">
            </div>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="row g-4">

        <div class="col-md-6">
            <button class="action-btn w-100">
                Submit Lead
            </button>
        </div>

        <div class="col-md-6">
            <button class="action-btn w-100">
                + Create New
            </button>
        </div>

    </div>

</div>

<script>

$("#uploadBtn").click(function(){
    $("#photoUpload").click();
});

$("#photoUpload").change(function(){

    let files = this.files;

    if(files.length > 4){
        alert("Maximum 4 images allowed");
        $(this).val('');
        return;
    }

    let html = '<div class="preview-images">';

    $.each(files,function(index,file){

        let imageUrl = URL.createObjectURL(file);

        html += `
            <img src="${imageUrl}">
        `;
    });

    html += '</div>';

    html += `
        <div class="upload-status">
            ${files.length}
            ${files.length === 1 ? 'image' : 'images'}
            uploaded successfully
        </div>
    `;

    $("#previewContainer").html(html);
});

$("#techCount").on("keyup change",function(){

    let value=$(this).val();

    $("#techSummary").text(
        (value || 0) + " Tech."
    );
});

$("#hrsReq").on("keyup change",function(){

    let value=$(this).val();

    $("#hrsSummary").text(
        (value || 0) + " Hrs"
    );
});

$("#afterHours").change(function(){

    $("#afterSummary").text(
        $(this).is(":checked")
        ? "After Hrs."
        : "Normal Hrs."
    );

});

</script>

</body>
</html>
