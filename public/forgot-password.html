<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">


</head>

<body>

       <!-- Loader -->
    <div id="containerLoader"
         class="d-none position-absolute top-0 start-0 w-100 h-100
                d-flex justify-content-center align-items-center"
         style="background: rgba(255,255,255,.7); z-index:999;">

        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

    </div>
    <div class="pre-login container">

        <img class="logo" src="images/excel_log.png" alt="logo">

        <h2>Update Password</h2>
        <div class="sub-text">
            Update your password securely
        </div>

        <form id="changePasswordForm">

            <div class="card">

                <div class="input-row">
                    <i class="fa-regular fa-envelope"></i>

                    <input type="email" id="email" placeholder="Enter email" required>
                    <a href="javascript:void(0);"
       id="resendPassword"
       class="resend-link">
        Resend Temp Password
    </a>
                </div>

                <div class="input-row">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="oldPassword" placeholder="Old/Temp Password" required>
                    <span class="eye" onclick="togglePassword('oldPassword',this)"><img id="password_eye"
                            class="lable_icon" src="images/password_eye_hide.png" alt="password_eye"></span>
                </div>





                <div class="input-row">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="New Password" required>
                    <span class="eye" onclick="togglePassword('newPassword',this)"><img id="password_eye"
                            class="lable_icon" src="images/password_eye_hide.png" alt="password_eye"></span>
                </div>

                <div class="input-row">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <span class="eye" onclick="togglePassword('confirmPassword',this)"><img id="password_eye"
                            class="lable_icon" src="images/password_eye_hide.png" alt="password_eye"></span>
                </div>

            </div>

            <button id="changePasswordBtn" type="button" class="button btn1 btn" style="margin-top: 10px;">
                <span class="button__text">Change Password</span>
            </button>

            <div class="error" id="errorMsg">
                Passwords do not match.
            </div>

            <div class="success" id="successMsg">
                Password changed successfully.
            </div>

        </form>

        <a href="/login" class="back-link">
            Back to Login
        </a>

    </div>

<div id="createNewConfirmModal"
            style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:99999;">
            <div
                style="background:#fff; border-radius:10px; width:min(92vw, 420px); box-shadow:0 10px 30px rgba(0,0,0,0.2); padding:20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h5 id="createNewConfirmModalTitle" style="margin:0; color:#222;">Create New Lead?</h5>
                    <button type="button" class="confirm-close" aria-label="Close"
                        style="border:none; background:transparent; font-size:24px; line-height:1; color:#666; cursor:pointer; padding:0; display: none;">×</button>
                </div>
                <p id="createNewConfirmModalMessage" style="margin:0 0 16px; color:#555;">Do you want to keep the
                    customer details and start a new lead with the rest cleared?</p>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn btn2 btn-border btn-outline-secondary confirm-no"
                        style="display:none;">No</button>
                    <button type="button" class="btn btn2 btn-primary confirm-yes">OK</button>
                </div>
            </div>
        </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
                <script src="script/common.js"></script>

    <script src="script/change-password.js"></script>
    <script src="script/login.js"></script>
    
    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const emailValue = urlParams.get('email');
        const temp = urlParams.get('tempPw');
        if (emailValue) {
            $('#email').prop('readonly', true).val(emailValue);

        }
        if (temp) {
            $('#oldPassword').attr('placeholder', 'Temp Password').prop('readonly', true).val(temp);
        }
        function togglePassword(id, icon) {
            const input = document.getElementById(id);

            if (input.type === "password") {
                input.type = "text";
                icon.querySelector('img').src = "images/password_eye_show.png";
            } else {
                input.type = "password";
                icon.querySelector('img').src = "images/password_eye_hide.png";
            }
        }

        document.getElementById("changePasswordForm")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                const newPass =
                    document.getElementById("newPassword").value;

                const confirmPass =
                    document.getElementById("confirmPassword").value;

                const error =
                    document.getElementById("errorMsg");

                const success =
                    document.getElementById("successMsg");

                error.style.display = "none";
                success.style.display = "none";

                if (newPass !== confirmPass) {
                    error.style.display = "block";
                    return;
                }

                success.style.display = "block";
            });
    </script>

</body>

</html>
