<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/lead-style.css" rel="stylesheet">

</head>

<body>

    <!-- Loader -->
    <div id="containerLoader" class="d-none position-absolute top-0 start-0 w-100 h-100
                d-flex justify-content-center align-items-center"
        style="background: rgba(255,255,255,.7); z-index:999;">

        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

    </div>

    <div class="pre-login container">
        <!-- Loader -->
        <div id="loader" class="position-absolute top-0 start-0 w-100 h-100 d-none
                justify-content-center align-items-center" style="background: rgba(255,255,255,0.8); z-index:1000;">

            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2">Please wait...</div>
            </div>

        </div>
        <div style="width:20%;justify-content: space-between;position: relative;margin: 8px auto;">
            <select id="simproEnvSelect"
                style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:8px; background:#fff; color:#333; appearance:none;">
                <option value="PROD">Production</option>
                <option value="UAT">UAT</option>
            </select>
        </div>
        <!-- Logo -->
        <img class="logo" src="images/excel_log.png" alt="logo">


        <!-- Title -->
        <h2>Login</h2>
        <!-- <div class="sub-text">
            Don’t have an account? <a href="/register">Sign Up</a>
        </div> -->

        <!-- Form -->
        <form id="loginForm">

            <div class="card">
                <div class="input-row">
                    <!-- <img class="lable_icon" src="images/email.png" alt="email"> -->
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="input-row">
                    <!-- <img class="lable_icon" src="images/password.png" alt="password"> -->
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="eye" onclick="togglePassword()"><img id="password_eye" class="lable_icon"
                            src="images/password_eye_hide.png" alt="password_eye"></span>
                </div>
            </div>

            <div id="forgotPassword" class="forgot d-flex justify-content-between d-none">
                <a id="changePasswordLink" href="/forgotPassword">Change Password?</a>
                <a id="forgotPasswordLink" href="#">Forgot Password?</a>
            </div>

            <button id="loginBtn" type="button" class="button btn1 btn d-none login">
                <span class="button__text">Log In</span>
            </button>
            <div class="error" id="errorMsg">
                Passwords do not match.
            </div>
        </form>

        <div id="createNewConfirmModal"
            style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:99999;">
            <div
                style="background:#fff; border-radius:10px; width:min(92vw, 420px); box-shadow:0 10px 30px rgba(0,0,0,0.2); padding:20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h5 id="createNewConfirmModalTitle" style="margin:0; color:#222;">Create New Lead?</h5>
                    <button type="button" class="confirm-close" aria-label="Close"
                        style="border:none; background:transparent; font-size:24px; line-height:1; color:#666; cursor:pointer; padding:0; display: none;">×</button>
                </div>
                <p id="createNewConfirmModalMessage" style="margin:0 0 16px; color:#555;">Do you want to keep the
                    customer details and start a new lead with the rest cleared?</p>
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn btn2 btn-border btn-outline-secondary confirm-no"
                        style="display:none;">No</button>
                    <button type="button" class="btn btn2 btn-primary confirm-yes">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script/common.js"></script>

    <script src="script/login.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icon fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>

        // Show/Hide Password
        function togglePassword() {
            const pwd = document.getElementById("password");
            pwd.type = pwd.type === "password" ? "text" : "password";

            document.getElementById("password_eye").src = pwd.type === "password" ? "images/password_eye_hide.png" : "images/password_eye_show.png";
        }
    </script>

</body>

</html>
