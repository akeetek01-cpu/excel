<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

</head>

<body>

    <div class="pre-login container">

        <img class="logo" src="images/excel_log.png" alt="logo">
<button style="float: right;" id="leadLogoutButton" class="lead-logout-button" type="button" aria-label="Logout" title="Logout">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </button>
        <div id="welcomeMessage" class="welcome">
            Welcome
        </div>

        <button id="createLeadBtn" class="btn1 btn">
            Create a Lead
            <span>➜</span>
        </button>

        <button id="manageUsersBtn" class="btn1 btn d-none">
            Manage Users
            <span>➜</span>
        </button>

        <div class="stats-card">

            <!-- Jobs -->
            <!-- <div class="stat-row">

            <div class="circle"
                 data-percent="80"
                 data-text="80">
            </div>

            <div>
                <div class="stat-title">
                    Jobs Attended
                </div>
                <div class="stat-sub">
                    in last 4 weeks
                </div>
            </div>

        </div> 

        <div class="divider"></div>-->

            <!-- Leads -->
            <div class="stat-row">

                <div class="circle" data-percent="46" data-text="46">
                </div>

                <div>
                    <div class="stat-title">
                        Leads/Quotes Created
                    </div>
                    <div class="stat-sub">
                        in last 4 weeks
                    </div>
                </div>

            </div>

            <div class="divider"></div>

            <!-- Quotes -->
            <div class="stat-row">

                <div class="circle" data-percent="65" data-text="65%">
                </div>

                <div>
                    <div class="stat-title">
                        Quotes Approved
                    </div>
                    <div class="stat-sub">
                        by the Customer
                    </div>
                </div>

            </div>

        </div>

    </div>
    <div id="createNewConfirmModal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:99999;">
        <div
            style="background:#fff; border-radius:10px; width:min(92vw, 420px); box-shadow:0 10px 30px rgba(0,0,0,0.2); padding:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h5 id="createNewConfirmModalTitle" style="margin:0; color:#222;">Create New Lead?</h5>
                <button type="button" class="confirm-close" aria-label="Close"
                    style="border:none; background:transparent; font-size:24px; line-height:1; color:#666; cursor:pointer; padding:0;">×</button>
            </div>
            <p id="createNewConfirmModalMessage" style="margin:0 0 16px; color:#555;">Do you want to keep the customer
                details and start a new lead with the rest cleared?</p>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" class="btn btn2 btn-border btn-outline-secondary confirm-no"
                    style="display:none;">No</button>
                <button type="button" class="btn btn2 btn-primary confirm-yes">OK</button>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script/dashboard.js"></script>
    <script src="script/common.js"></script>
    <script>
        const createLeadBtn = document.getElementById("createLeadBtn");

        // Attach the click event listener
        createLeadBtn.addEventListener("click", function () {
            window.location.href = '/lead-form';
        });
        document.querySelectorAll('.circle').forEach(circle => {

            const percent = circle.dataset.percent;
            const text = circle.dataset.text;

            const radius = 40;
            const circumference = 2 * Math.PI * radius;

            const offset =
                circumference -
                (percent / 100) * circumference;

            circle.innerHTML = `
        <svg viewBox="0 0 100 100">
            <circle
                class="circle-bg"
                cx="50"
                cy="50"
                r="${radius}">
            </circle>

            <circle
                class="circle-progress"
                cx="50"
                cy="50"
                r="${radius}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${offset}">
            </circle>
        </svg>

        <div class="circle-text">
            ${text}
        </div>
    `;
        });

    </script>

</body>

</html>
