<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Lead</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lead-style.css">

</head>

<body>

    <div class="lead-capture container py-4">
        <div class="logo">
            <img src="images/excel_log.png" alt="Excel Logo">
            <label class="create-lead-label" style="min-width:100px">
                Create Lead
            </label>
        </div>
        <div class="wizard-card mx-auto">

            <!-- Top Stepper -->
            <div class="stepper d-flex justify-content-between mb-3" id="stepper">
                <div class="step" data-step="0">
                    <div class="icon"> <i class="fa-solid fa-user"></i> </div>
                    <div class="label">1. Customer Details</div>
                </div>
                <!-- <div class="divider"></div> -->
                <div class="step" data-step="1">
                    <div class="icon"> <i class="fa-solid fa-wrench"></i> </div>
                    <div class="label">2. Asset & Faults</div>
                </div>
                <!-- <div class="divider"></div> -->
                <div class="step" data-step="2">
                    <div class="icon"> <i class="fa-solid fa-calculator"></i> </div>
                    <div class="label">3. Estimates</div>
                </div>
            </div>

            <!-- Steps Container -->
            <div class="steps">

                <!-- STEP 1 -->
                <div class="step-pane" data-step-pane="0">
                    <div class="card p-3 mb-3 rounded-12">

                        <form id="form-customer" novalidate>
                            <div class="row">


                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">Job Number</label>
                                    <div class="flex-grow-1">
                                        <input type="number" id="jobNumber" class="form-control"
                                            placeholder="Enter Job Number" disabled>

                                        <div id="jobNumberError" class="invalid-feedback"></div>
                                    </div>
                                </div>

                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">No Job Number?</label>
                                    <div class="flex-grow-1">
                                        <button type="button" id="autoJobBtn" class="btn btn-primary"
                                            aria-pressed="false">
                                            Click & Generate Job Number
                                        </button>
                                    </div>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-12 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Tenancy / Shop
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="text" id="customerTenancy" class="form-control"
                                            style="text-transform: capitalize;" placeholder="Enter">

                                        <div id="customerTenancyError" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Customer Name
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="text" id="customerName" maxlength="100" class="form-control"
                                            style="text-transform: capitalize;" placeholder="Enter Customer Name">

                                        <div id="customerNameError" class="invalid-feedback"></div>
                                    </div>
                                </div>



                            </div>


                            <div class="row">
                                <div class="col-12 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Phone
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="tel" id="customerPhone" class="form-control 
" placeholder="8-10 digits number" maxlength="12">

                                        <div id="customerPhoneError" class="invalid-feedback">
                                            Please enter a valid phone number.
                                        </div>
                                    </div>
                                </div>

                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Email
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="email" id="customerEmail" class="form-control"
                                            placeholder="abc@abc.com">

                                        <div id="customerEmailError" class="invalid-feedback"></div>
                                    </div>
                                </div>

                            </div>

                            <div class="mb-2">
                                <label class="form-label">Notes</label>
                                <textarea id="customerNotes" class="form-control auto-resize" rows="2" maxlength="150"
                                    placeholder="Enter notes"></textarea>
                            </div>

                        </form>

                    </div>
                </div>

                <!-- STEP 2 -->
                <div class="step-pane d-none" data-step-pane="1">
                    <div class="card p-3 mb-3 rounded-12">

                        <div class="fault-card">
                            <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Asset Description
                                </label>

                                <div class="flex-grow-1">
                                    <select id="assetDescriptionSelect" class="form-select"
                                        aria-label="Asset description">
                                        <option value="">Select / Enter</option>
                                        <option value="other">Other (enter below)</option>
                                    </select>
                                    <div id="assetDescriptionError" class="invalid-feedback"></div>

                                    <!-- <input type="text" id="assetDescriptionInput" class="form-control mt-2 d-none"
                                        placeholder="Enter asset description"> -->
                                    <textarea id="assetDescriptionInput" class="form-control auto-resize d-none"" rows="
                                        2" maxlength="150" placeholder="Enter asset description"></textarea>
                                    <div id="assetDescriptionInputError" class="invalid-feedback"></div>
                                </div>

                            </div>

                            <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Asset Location</label>
                                <div class="flex-grow-1">
                                    <select id="assetLocation" class="form-select" aria-label="Asset location">
                                        <option value="">Select / Enter</option>
                                        <option value="other">Other (enter below)</option>
                                    </select>
                                    <div id="assetLocationError" class="invalid-feedback"></div>

                                    <!-- <input type="text" id="assetLocationInput" class="form-control mt-2 d-none"
                                        placeholder="Enter asset location" required> -->
                                    <textarea id="assetLocationInput" class="form-control auto-resize d-none"" rows=" 2"
                                        maxlength="150" placeholder="Enter asset location"></textarea>
                                    <div id="assetLocationInputError" class="invalid-feedback"></div>

                                </div>
                                <!-- <div class="mb-3 d-flex gap-2 flex-column flex-sm-row">
                                
                                <select id="assetDescription" class="form-select flex-grow-1"
                                    aria-label="Asset description">
                                    <option value="">Select / enter</option>
                                    <option>Air Conditioner</option>
                                    <option>Fridge</option>
                                    <option>Oven</option>
                                </select>

                                <select id="assetLocation" class="form-select flex-grow-1" aria-label="Asset location">
                                    <option value="">Select / enter</option>
                                    <option>Kitchen</option>
                                    <option>Store Room</option>
                                    <option>Roof</option>
                                </select>
                            </div> -->
                            </div>
                        </div>
                        <div id="faultList"></div>

                        <div class="d-grid mt-2">
                            <button type="button" id="addFaultBtn" class="btn btn-outline-purple">+ Add Another
                                Fault</button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- STEP 3 -->
            <div class="step-pane d-none" data-step-pane="2">
                <div class="card p-3 mb-3 rounded-12">

                    <div class="row g-5 align-items-start">
                        <div class="col-6">
                            <label class="form-label">Technicians Required</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="techniciansMinus">−</button>
                                <input type="number" id="technicians" class="form-control spinner-input" min="1"
                                    max="10" value="1">
                                <button type="button" class="spinner-btn spinner-plus" id="techniciansPlus">+</button>
                            </div>
                            <div id="techniciansError" class="invalid-feedback"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Apprentice Required</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="apprenticeMinus">−</button>
                                <input type="number" id="apprentice" class="form-control spinner-input" min="0" max="10"
                                    value="0">
                                <button type="button" class="spinner-btn spinner-plus" id="apprenticePlus">+</button>
                            </div>
                            <div id="apprenticeError" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="row mt-3 g-2">
                        <div class="col-6">
                            <label class="form-label">Hours Required</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="hoursMinus">−</button>
                                <input type="number" id="hours" class="form-control spinner-input" min="0" step="0.5"
                                    value="0">
                                <button type="button" class="spinner-btn spinner-plus" id="hoursPlus">+</button>
                            </div>
                            <div id="hoursError" class="invalid-feedback"></div>
                        </div>
                        <div class="col-6 d-flex align-items-end afterhrs-container">
                            <label class="after-hours-label me-2 mb-2">After Hours?</label>
                            <div class="form-check form-switch">
                                <!-- <input class="form-check-input" type="checkbox" id="afterHours"> -->
                                <label class="switch">
                                    <input type="checkbox" id="afterHours">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="summary-estimates cards-row d-flex gap-2 mt-4">
                        <div class="stat-card">
                            <div class="title">Total Faults</div>
                            <div id="statFaults" class="value">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="title">Total Technicians</div>
                            <div id="statTech" class="value">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="title">Total Hours</div>
                            <div id="statHours" class="value">-</div>
                        </div>
                    </div>

                    <div class="mt-3 photo-upload-card p-3 rounded-12">
                        <div class="photo-upload-header d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <label class="form-label-1 mb-1">Upload Job Photos</label>
                                <!-- <div class="text-muted small">Tap to browse or drag & drop</div> -->
                            </div>
                            <div id="photoCount" class="photo-upload-count" style="color: var(--teal); font-size: 13px;">0 / 10</div>
                        </div>

                        <div id="dropZone" class="photo-upload-dropzone p-4 text-center rounded-8">
                            <div class="dz-content">
                                <i class="fa-regular fa-image fa-2x mb-2"></i>
                                <div class="fw-bold" style="color: var(--teal);">Tap to browse or drag & drop</div>
                                <div class="small text-muted" style="color: var(--teal);">JPG, PNG, HEIC · max 10 images
                                </div>
                            </div>
                            <input type="file" id="photoInput" accept="image/*" multiple hidden>
                        </div>

                        <div id="previewGrid" class="photo-preview-grid mt-3 d-flex flex-wrap gap-2"
                            style="display:none;"></div>
                        <div id="uploadStatus" class="photo-status mt-2" style="display:none;"></div>
                    </div>

                </div>
            </div>

        </div>

        <!-- Sticky Footer Nav -->
        <div class="footer-nav d-flex justify-content-between align-items-center p-3">
            <button class="btn btn-outline-secondary btn-sm" id="backBtn" aria-label="Back">
                <i class="fa-solid fa-arrow-left"></i>Back
            </button>
            <div id="nextButtonContainer" class="d-flex justify-content-center align-items-center">
                <button id="nextBtn" type="button" class="customer-next-btn btn btn-primary">Next -> Asset &
                    Fault</button>

                <button style="display: none;" type="button" class="btn btn-outline-secondary btn-sm"
                    id="createNewBtn">+ Create New</button>

            </div>

        </div>
        <!-- <div class="d-flex justify-content-center align-items-center">
            <button id="nextBtn" type="button" class="customer-next-btn btn btn-primary">Next -> Asset & Fault</button>
        </div> -->

    </div>
    </div>

    <!-- Submit Modal -->
    <div class="modal fade" id="submitModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Job Submitted Successfully</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Job <strong id="modalJobNum"></strong> for <strong id="modalCustomer"></strong> submitted at
                        <span id="modalTime"></span>
                    </p>
                    <pre id="jsonOutput" class="p-2 bg-light rounded-2" style="max-height:400px; overflow:auto;"></pre>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-success" id="downloadJson">Download JSON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/script.js"></script>
    <script src="script/lead-capture-v1.js"></script>
    <script src="script/validation.js"></script>

</body>

</html>
