<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Lead</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lead-style.css">

</head>

<body>

    <div class="lead-capture container">
        <div class="logo">
            <img src="images/excel_log.png" alt="Excel Logo">
            <label id="createLeadLabel" class="create-lead-label" style="min-width:100px">

            </label>
        </div>
        <div class="mx-auto">

            <!-- Top Stepper -->
            <div class="stepper d-flex justify-content-between" id="stepper">
                <div class="step" data-step="0">
                    <div class="icon"> <i class="fa-solid fa-user"></i> </div>
                    <div class="label">1. Customer Details</div>
                </div>
                <!-- <div class="divider"></div> -->
                <div class="step" data-step="1">
                    <div class="icon"> <i class="fa-solid fa-wrench"></i> </div>
                    <div class="label">2. Asset & Faults</div>
                </div>
                <!-- <div class="divider"></div> -->
                <div class="step" data-step="2">
                    <div class="icon"> <i class="fa-solid fa-calculator"></i> </div>
                    <div class="label">3. Estimates</div>
                </div>
            </div>

            <!-- Steps Container -->
            <div class="steps">

                <!-- STEP 1 -->
                <div class="step-pane" data-step-pane="0">
                    <div class="card p-3 rounded-12">

                        <form id="form-customer" novalidate>
                            <div class="row">


                                <div class="col-4 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">Job Number</label>
                                    <div class="flex-grow-1">
                                        <input type="text" id="jobNumber" class="form-control" placeholder="Enter"
                                            maxlength="6" required inputmode="numeric" pattern="[0-9]*">

                                        <div id="jobNumberError" class="invalid-feedback"></div>
                                    </div>
                                </div>

                                <div class="col-8 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">Customer Name</label>
                                    <div class="flex-grow-1">
                                        <input type="text" id="autoJobBtn" class="form-control border-dashed" maxlength="150" placeholder="" readonly="">
                                    
                                    </div>
                                </div>

                            </div>
                            <div class="row">
                                <div class="col-12 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Site
                                    </label>

                                    <div class="flex-grow-1">
                                        <select id="customerTenancy" class="form-select" aria-label="Site">
                                            <option value="" selected disabled hidden>Select Site</option>
                                            <option value="Other">Other</option>
                                        </select>

                                        <div id="customerTenancyError" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <!-- <div class="col-6 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">Site Contract</label>
                                    <div class="flex-grow-1">
                                        <div id="siteContractName" class="border border-dashed rounded-3 px-3 py-2"
                                            style="min-height: 38px; display: flex; align-items: center;">
                                            Site contract will be auto-filled
                                        </div>
                                    </div>
                                </div> -->
                            </div>
                            <div class="row">


                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Customer Contact Name
                                    </label>

                                    <div class="flex-grow-1">
                                        <div class="row g-2 align-items-start">
                                            <div id="customerNameSelectWrapper" class="col-12">
                                                <select id="customerName" class="form-select"
                                                    aria-label="Customer contact name">
                                                    <option value="" selected disabled>Select Contact</option>
                                                    <option value="other">Other</option>
                                                </select>
                                                <div id="customerNameError" class="invalid-feedback"></div>
                                            </div>
                                            <div id="customerNameInputWrapper" class="col-12 d-none">
                                                <input type="text" id="customerNameInput" class="form-control"
                                                    maxlength="150" placeholder="Enter customer contact name">
                                                <div id="customerNameInputError" class="invalid-feedback"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>



                            </div>


                            <div class="row">
                                <div class="col-12 mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Phone
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="tel" id="customerPhone" class="form-control 
" placeholder="8-10 digits number" maxlength="12">

                                        <div id="customerPhoneError" class="invalid-feedback">
                                            Please enter a valid phone number.
                                        </div>
                                    </div>
                                </div>

                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Email
                                    </label>

                                    <div class="flex-grow-1">
                                        <input type="email" id="customerEmail" class="form-control"
                                            placeholder="abc@abc.com">

                                        <div id="customerEmailError" class="invalid-feedback"></div>
                                    </div>
                                </div>

                            </div>

                            <div class="mb-2">
                                <label class="form-label">Notes</label>
                                <textarea id="customerNotes" class="form-control auto-resize" rows="1" maxlength="150"
                                    placeholder="Enter notes"></textarea>
                            </div>

                        </form>

                    </div>
                </div>

                <!-- STEP 2 -->
                <div class="step-pane d-none" data-step-pane="1">
                    <div class="card p-3 mb-3 rounded-12">

                        <div class="fault-card">
                            <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Customer Asset ID or Excel Barcode</label>
                                <div class="flex-grow-1">
                                    <div class="row g-2 align-items-start">
                                        <div id="customerAssetIdSelectWrapper" class="col-12">
                                            <select id="customerAssetId" class="form-select"
                                                aria-label="Customer asset ID or Excel barcode">
                                                <option value="" selected disabled>Select / Enter</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>
                                        <div id="customerAssetIdInputWrapper" class="col-12 d-none">
                                            <input type="text" id="customerAssetIdInput" class="form-control"
                                                placeholder="Enter customer asset ID or Excel barcode">
                                            <div id="customerAssetIdInputError" class="invalid-feedback"></div>
                                        </div>
                                    </div>
                                    <input type="file" id="barcodeFileInput" accept="image/*" capture="environment"
                                        class="d-none">
                                </div>
                            </div>
                             <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Asset Description
                                </label>

                                <div class="flex-grow-1">
                                    <div class="row g-3 align-items-start">
                                        <!-- <div id="assetDescriptionSelectWrapper" class="col-12">
                                            <select id="assetDescriptionSelect" class="form-select"
                                                aria-label="Asset description">
                                                <option value="" selected disabled>Select / Enter</option>
                                                <option value="other">Other</option>
                                            </select>
                                            <div id="assetDescriptionError" class="invalid-feedback"></div>
                                        </div> -->
                                        <div id="assetDescriptionInputWrapper" class="col-12">
                                            <input type="text" id="assetDescriptionInput" class="form-control"
                                                maxlength="150" placeholder="Enter asset description">
                                            <div id="assetDescriptionInputError" class="invalid-feedback"></div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Make</label>
                                <div class="flex-grow-1">
                                    <input id="assertMake" maxlength="150" class="form-control"
                                        placeholder="Enter Make">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Model (IDU)</label>
                                    <div class="flex-grow-1">
                                        <input id="assertModel" maxlength="150" class="form-control"
                                            placeholder="Enter Model">
                                    </div>
                                </div>
                                <div class="col mb-3 align-items-start">
                                    <label class="form-label me-2 mb-0" style="min-width:100px">
                                        Serial Number (IDU)</label>
                                    <div class="flex-grow-1">
                                        <input id="assertSerialNumber" maxlength="150" class="form-control"
                                            placeholder="Enter Serial Number">
                                    </div>
                                </div>
                            </div>
                           

                            <div class="mb-3 align-items-start">
                                <label class="form-label me-2 mb-0" style="min-width:100px">
                                    Asset Location</label>
                                <div class="flex-grow-1">
                                    <input id="assetLocation" maxlength="150" class="form-control work-req"
                                        placeholder="Enter Asset Location">
                                    <div id="assetLocationError" class="invalid-feedback"></div>

                                    <div id="assetLocationInputError" class="invalid-feedback"></div>

                                </div>
                            </div>


                        </div>
                        <div id="faultList"></div>

                        <div class="d-grid mt-2">
                            <button type="button" id="addFaultBtn" class="btn1 btn btn-outline-purple">+ Add Another
                                Fault</button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- STEP 3 -->
            <div class="step-pane d-none" data-step-pane="2">
                <div class="card p-3 mb-3 rounded-12">



                    <div class="row g-3 align-items-start">
                        <div class="col-4">
                            <label class="form-label">Technicians</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="techniciansMinus">−</button>
                                <input type="number" id="technicians" class="form-control spinner-input" min="1"
                                    max="10" value="1">
                                <button type="button" class="spinner-btn spinner-plus" id="techniciansPlus">+</button>
                            </div>
                            <div id="techniciansError" class="invalid-feedback"></div>
                        </div>
                        <div class="col-4">
                            <label class="form-label">Apprentice</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="apprenticeMinus">−</button>
                                <input type="number" id="apprentice" class="form-control spinner-input" min="0" max="10"
                                    value="0">
                                <button type="button" class="spinner-btn spinner-plus" id="apprenticePlus">+</button>
                            </div>
                            <div id="apprenticeError" class="invalid-feedback"></div>
                        </div>
                        <div class="col-4">
                            <label class="form-label">Hours</label>
                            <div class="spinner-control">
                                <button type="button" class="spinner-btn spinner-minus" id="hoursMinus">−</button>
                                <input type="number" id="hours" class="form-control spinner-input" min="0" step="1"
                                    value="0">
                                <button type="button" class="spinner-btn spinner-plus" id="hoursPlus">+</button>
                            </div>
                            <div id="hoursError" class="invalid-feedback"></div>
                        </div>
                    </div>


                    <div class="mt-3 mb-3 photo-upload-card p-3 rounded-12">
                        <div class="photo-upload-header d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <label class="form-label-1 mb-1">Upload Job Photos</label>
                                <!-- <div class="text-muted small">Tap to browse or drag & drop</div> -->
                            </div>
                            <div id="photoCount" class="photo-upload-count"
                                style="color: var(--teal); font-size: 13px;">0 / 10</div>
                        </div>

                        <div id="dropZone" class="photo-upload-dropzone text-center rounded-8">
                            <div class="dz-content">
                                <i class="fa-regular fa-image fa-2x mb-2"></i>
                                <div class="fw-bold" style="color: var(--teal);">Tap to browse or drag & drop</div>
                                <div class="small text-white" style="color: var(--teal);">JPG, PNG, HEIC · max 10 images
                                </div>
                            </div>
                            <input type="file" id="photoInput" accept="image/*" multiple hidden>
                        </div>

                        <div id="previewGrid" class="photo-preview-grid mb-1 d-flex flex-wrap gap-2"
                            style="display:none;"></div>
                        <div id="uploadStatus" class="photo-status mt-2" style="display:none;"></div>
                    </div>
                    <div class="summary-title mt-3">Review Summary</div>

                    <div class="summary-estimates">
                        <div class="cards-row mb-1">


                            <div class="stat-card">
                                <div class="title">Total Faults</div>
                                <div id="statFaults" class="value">-</div>
                            </div>
                            <div class="stat-card">
                                <div class="title">Total Technicians</div>
                                <div id="statTech" class="value">-</div>
                            </div>
                            <div class="stat-card">
                                <div class="title">Total Hours</div>
                                <div id="statHours" class="value">-</div>
                            </div>
                        </div>
                        <div class="row g-3 align-items-start ms-2 me-2 mb-2">
                            <div class="col-6">
                                <label class="form-label">Cost Center</label>
                                <select id="costCenterSelect" class="form-select" aria-label="Cost Center">
                                    <option value="">Select Cost Center</option>
                                </select>
                                <div id="costCenterError" class="invalid-feedback"></div>
                            </div>
                            <div class="col-6" style="display: none;">
                                <label class="form-label">Team</label>
                                <div id="salesTeamId" class="border border-dashed rounded-3 px-3 py-2"
                                    style="min-height: 38px; display: flex; align-items: center;"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Service Manager</label>
                                <select id="serviceManagerSelect" class="form-select" aria-label="Service Manager">
                                    <option value="">Select Service Manager</option>
                                </select>
                                <div id="serviceManagerError" class="invalid-feedback"></div>
                            </div>
                        </div>
                        <div class="row g-3 align-items-start ms-2 me-2 mb-2">
                            <div class="col-6">
                                <label class="form-label">Tags</label>
                                <select id="tagsSelect" class="form-select" aria-label="Tags">
                                    <option value="">Select Tags</option>
                                </select>
                                <div id="tagsError" class="invalid-feedback"></div>
                            </div>
                            <div class="col-6 d-flex align-items-end afterhrs-container">
                                <label class="after-hours-label mb-2">After Hours (OT)?</label>
                                <div class="form-check form-switch">
                                    <!-- <input class="form-check-input" type="checkbox" id="afterHours"> -->
                                    <label class="switch">
                                        <input type="checkbox" id="afterHours">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>



                </div>
            </div>

        </div>

        <!-- Sticky Footer Nav -->
        <div class="footer-nav d-flex justify-content-between align-items-center p-3">
            <button class="btn1 btn btn-outline-secondary btn-sm" id="backBtn" aria-label="Back">
                <i class="fa-solid fa-arrow-left"></i>Back
            </button>
            <div id="nextButtonContainer" class="d-flex justify-content-center align-items-center">
                <button id="nextBtn" type="button" class="customer-next-btn btn1 btn btn-primary">Next -> Asset &
                    Faults</button>

                <button style="display: none;" type="button" class="btn1 btn btn-outline-secondary btn-sm"
                    id="createNewBtn">+ New</button>

            </div>

        </div>
        <!-- <div class="d-flex justify-content-center align-items-center">
            <button id="nextBtn" type="button" class="customer-next-btn btn btn-primary">Next -> Asset & Fault</button>
        </div> -->

    </div>
    </div>

    <!-- Submit Modal -->
    <div class="modal fade" id="submitModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Job Submitted Successfully</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Job <strong id="modalJobNum"></strong> for <strong id="modalCustomer"></strong> submitted at
                        <span id="modalTime"></span>
                    </p>
                    <pre id="jsonOutput" class="p-2 bg-light rounded-2" style="max-height:400px; overflow:auto;"></pre>
                </div>
                <div class="modal-footer">
                    <button class="btn1 btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn1 btn btn-success" id="downloadJson">Download JSON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
    <!-- QuaggaJS fallback for devices/browsers where Html5Qrcode doesn't work (e.g., some iOS Safari cases) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="script/config.js"></script>
    <script src="script/lead-submit.js"></script>
    <script src="script/lead-attachments.js"></script>
    <script src="script/script.js"></script>
    <script src="script/companies-api.js"></script>
    <script src="script/job-number-api.js"></script>
    <script src="script/customer-contact-api.js"></script>
    <script src="script/cost-center-api.js"></script>
    <script src="script/asset-lookup-api.js"></script>
    <script src="script/validation.js"></script>
    <script src="script/service-managers.js"></script>
    <script src="script/totalRecovery.js"></script>
    <script src="script/work-required.js"></script>
    <script src="script/tags-api.js"></script>
</body>

</html>
